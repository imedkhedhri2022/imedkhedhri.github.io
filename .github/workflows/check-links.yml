name: Check links

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-links:
    name: Check for broken links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.md' './**/*.html'
